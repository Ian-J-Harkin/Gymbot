services:
  evaluation-db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: fitbot_eval
      POSTGRES_PASSWORD: fitbot_eval_password
      POSTGRES_DB: fitbot_eval
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitbot_eval -d fitbot_eval"]
      interval: 2s
      timeout: 2s
      retries: 20