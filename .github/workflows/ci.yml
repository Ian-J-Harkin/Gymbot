name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint, Format, and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Monorepo Dependencies
        run: |
          npm install
          cd fitbot-api && npm install
          cd ../fitbot-admin && npm install
          cd ../packages/fitbot-react && npm install

      - name: Generate Prisma Client
        run: |
          cd fitbot-api
          npx prisma generate

      - name: Backend Unit Tests (fitbot-api)
        run: |
          cd fitbot-api
          npm run test

      - name: Frontend Build (fitbot-admin)
        run: |
          cd fitbot-admin
          npm run build

  e2e-tests:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd demos/fitbot-react-demo
          npm install
          cd ../../packages/fitbot-react
          npm install

      - name: Start Docker Services
        run: docker compose -f docker-compose.react-test.yml up -d

      - name: Install Playwright Browsers
        run: |
          cd demos/fitbot-react-demo
          npx playwright install --with-deps

      - name: Await Services
        run: sleep 20

      - name: Run Playwright Tests
        run: |
          cd demos/fitbot-react-demo
          npx playwright test
        env:
          VITE_FITBOT_API_URL: http://localhost:3005/api
          
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: demos/fitbot-react-demo/playwright-report/
          retention-days: 7
