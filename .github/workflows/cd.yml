name: CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-packages:
    name: Build Universal Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React Adapter
        run: |
          cd packages/fitbot-react
          npm install
          npm run build

      - name: Build Next.js Adapter
        run: |
          cd packages/fitbot-nextjs
          npm install
          npm run build

      - name: Build Angular Adapter
        run: |
          cd packages/fitbot-angular
          npm install
          npm run build

  deploy-backend:
    name: Deploy fitbot-api to Render
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          # Expects RENDER_DEPLOY_HOOK to be set in GitHub secrets
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          else
            echo "RENDER_DEPLOY_HOOK not configured. Bypassing."
          fi

  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Run Prisma Migrate Deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          cd fitbot-api
          npm install
          if [ -n "$DATABASE_URL" ]; then
            npx prisma migrate deploy
          else
            echo "PROD_DATABASE_URL not configured. Bypassing."
          fi

  deploy-frontend:
    name: Deploy Frontends to Vercel
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Admin Dashboard to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          working-directory: ./fitbot-admin
          vercel-args: '--prod'

      - name: Deploy React Demo to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_DEMO_PROJECT_ID }}
          working-directory: ./demos/fitbot-react-demo
          vercel-args: '--prod'
